add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Origin-Agent-Cluster "?1" always;
add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; font-src 'self'; img-src 'self' data:; manifest-src 'self'; script-src https://discuss.grapheneos.org/assets/js/ https://discuss.grapheneos.org/assets/admin.js https://discuss.grapheneos.org/assets/admin-en.js https://discuss.grapheneos.org/assets/forum.js https://discuss.grapheneos.org/assets/forum-en.js https://discuss.grapheneos.org/assets/xslt-polyfill/xslt-polyfill.min.js 'sha256-UR1yduNVVuyN9jNA946eQ9IYbpp0/yPfNoh7pn4xzYM=' 'sha256-KU6hUJvCF6Q1nIBl9cm+VjJSi66McN7Kl4cI9XOYhww=' 'sha256-csmL8xvyfaUS3RfICF/X77Edfw41zjCmMSWa77HRIb0=' 'sha256-w/gV47o7JyPeo6z5P618xxyGFthwDD8t0LpdahMvuMM='; style-src https://discuss.grapheneos.org/assets/admin.css https://discuss.grapheneos.org/assets/admin-dark.css https://discuss.grapheneos.org/assets/forum.css https://discuss.grapheneos.org/assets/forum-dark.css 'unsafe-inline'; webrtc 'block'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), bluetooth=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), keyboard-map=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;

# obsolete and replaced with Content-Security-Policy frame-ancestors 'none'
add_header X-Frame-Options "DENY" always;

# obsolete, unsafe and replaced with strong Content-Security-Policy
add_header X-XSS-Protection "0" always;
